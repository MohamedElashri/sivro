name: PR checks

# Documentation-only changes skip CI; a change that also touches code runs it.
on:
  pull_request:
    paths-ignore: &docs
      - "**.md"
      - "docs/**"
      - LICENSE
  push:
    branches: [main]
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and regressions
    # Release commits are pushed with their tag; release.yml runs every check.
    if: &not-release "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: Release v')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: make fmt-check
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: make frontend test-frontend

  rust:
    name: Linux lint, backend and GUI checks
    needs: frontend
    if: *not-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Share dependencies between the app and library checks; GUI uses debug too.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SIVRO_BIN: ${{ github.workspace }}/target/debug/sivro
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> ../target
            experiments/library-checks -> ../../target
          cache-on-failure: true
          cache-bin: false
      - name: Cache prebuilt DuckDB
        uses: actions/cache@v6
        with:
          path: src-tauri/libs
          key: ${{ runner.os }}-${{ runner.arch }}-duckdb-${{ hashFiles('src-tauri/Cargo.lock', 'scripts/fetch-duckdb.mjs') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-duckdb-
      - name: Install native and GUI dependencies once
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libayatana-appindicator3-dev libgtk-3-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev \
            patchelf unzip xdg-utils webkit2gtk-driver xvfb xauth
      # Clippy gates every native test and desktop build on this runner.
      - run: make lint
      - run: make test-backend test-libs
      - run: git diff --exit-code
      - name: Generate GUI fixtures once
        run: |
          export SIVRO_E2E_DIR="$RUNNER_TEMP/sivro-e2e-fixtures"
          echo "SIVRO_E2E_DIR=$SIVRO_E2E_DIR" >> "$GITHUB_ENV"
          node scripts/with-duckdb.mjs cargo test --locked --manifest-path src-tauri/Cargo.toml --lib write_e2e_fixtures -- --ignored
      - name: Cache WebDriver binary
        id: webdriver-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/tauri-driver
          key: ubuntu24-${{ runner.arch }}-tauri-driver-2.1.0
      - name: Install WebDriver on cache miss
        if: steps.webdriver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - run: make app-debug
      - run: xvfb-run -a node tests/e2e/run.mjs --fixtures "$SIVRO_E2E_DIR"
      # Ubuntu 24.04 restricts the offline test's unprivileged network namespace.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a node tests/e2e/run.mjs --offline --fixtures "$SIVRO_E2E_DIR"

  platforms:
    name: Backend tests on ${{ matrix.name }}
    needs: rust
    # Cross-platform reader suites: on main and on demand (DuckDB compiles from
    # source on Windows, which is too slow for every pull request).
    if: "github.event_name == 'workflow_dispatch' || github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: Release v')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-14
            features: ""
          - name: Windows x86_64
            runner: windows-2025
            features: --features source-bundled
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Run backend tests
        if: runner.os != 'Windows'
        run: make test-backend
      - name: Run backend tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm ci
          npm run build
          cargo test --locked --manifest-path src-tauri/Cargo.toml ${{ matrix.features }}
