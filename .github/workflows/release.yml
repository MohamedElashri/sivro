name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create or reuse GitHub release
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      release_draft: ${{ steps.release.outputs.release_draft }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify updater signing is configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Set TAURI_SIGNING_PRIVATE_KEY before releasing (see docs/development.md)." >&2
            exit 1
          fi

      - name: Verify canonical version, generated metadata and release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: npm run version:check

      - name: Extract release notes from changelog
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          awk -v heading="## ${RELEASE_TAG#v}" '
            $0 == heading || index($0, heading " - ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-body.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-body.md"; then
            echo "CHANGELOG.md must contain release notes for ${RELEASE_TAG#v}." >&2
            exit 1
          fi

      - name: Verify the requested release tag exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > /dev/null

      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_TAG" != v* || "$RELEASE_TAG" == */* || "$RELEASE_TAG" == *[!a-zA-Z0-9._-]* ]]; then
            echo "RELEASE_TAG must start with v and contain only letters, numbers, dots, underscores, or hyphens." >&2
            exit 1
          fi

          releases_endpoint="repos/${GITHUB_REPOSITORY}/releases?per_page=100"
          release_json="$(gh api "$releases_endpoint" | jq -c --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)][0]')"
          if [[ "$release_json" != "null" ]]; then
            if [[ "$(jq -r '.draft' <<<"$release_json")" != "true" ]]; then
              echo "Published releases are immutable. Bump the version instead of replacing signed update assets." >&2
              exit 1
            fi
            if [[ "$(jq -r '.prerelease' <<<"$release_json")" == "true" ]]; then
              echo "This workflow publishes stable updates; the existing draft is marked as a prerelease." >&2
              exit 1
            fi
            echo "Reusing existing release for ${RELEASE_TAG}."
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file "$RUNNER_TEMP/release-body.md"
          else
            echo "Creating draft release for ${RELEASE_TAG}."
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Sivro ${RELEASE_TAG}" \
              --notes-file "$RUNNER_TEMP/release-body.md" \
              --draft

            # Newly created draft releases can take a few seconds to appear in
            # the releases list. The by-tag endpoint cannot retrieve drafts.
            for attempt in {1..10}; do
              release_json="$(gh api "$releases_endpoint" | jq -c --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)][0]')"
              [[ "$release_json" != "null" ]] && break
              echo "Waiting for GitHub to return the new draft release (attempt ${attempt}/10)."
              sleep 3
            done
          fi

          if [[ "$release_json" == "null" ]]; then
            echo "Could not find the GitHub release for ${RELEASE_TAG} after creating it." >&2
            exit 1
          fi

          {
            echo "release_id=$(jq -r '.id' <<<"$release_json")"
            echo "release_draft=$(jq -r '.draft' <<<"$release_json")"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted runners build natively for each architecture.
          # macOS/Linux link prebuilt DuckDB static archives (fast);
          # Windows MSVC compiles DuckDB from source (official static
          # archives are MinGW-only) via --features source-bundled.
          # Required release gates: Linux x86_64, Windows x86_64 and one
          # universal macOS app (x86_64 + ARM64). ARM64 Linux/Windows are
          # experimental and cannot block or fail a release.
          - name: macOS Universal (x86_64 + ARM64)
            runner: macos-14
            os: macos
            rust_target: universal-apple-darwin
            toolchain_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
          - name: Linux Intel (x86_64)
            runner: ubuntu-22.04
            os: linux
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: --target x86_64-unknown-linux-gnu
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            os: linux
            rust_target: aarch64-unknown-linux-gnu
            tauri_args: --target aarch64-unknown-linux-gnu
            experimental: true
          - name: Windows Intel (x86_64)
            runner: windows-2025
            os: windows
            rust_target: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc --features source-bundled
          - name: Windows ARM64
            runner: windows-11-arm
            os: windows
            rust_target: aarch64-pc-windows-msvc
            tauri_args: --target aarch64-pc-windows-msvc --features source-bundled
            experimental: true

    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchain_targets || matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            unzip \
            xdg-utils

      # The universal macOS build links fat archives merged with lipo.
      - name: Fetch prebuilt DuckDB static libs
        if: matrix.os != 'windows'
        shell: bash
        env:
          DUCKDB_TRIPLE: ${{ matrix.os == 'macos' && 'universal-apple-darwin' || '' }}
        run: |
          set -euo pipefail
          node scripts/fetch-duckdb.mjs | tee /tmp/duckdb-env.txt
          grep '^DUCKDB_LIB_DIR=' /tmp/duckdb-env.txt >> "$GITHUB_ENV"
          echo "DUCKDB_STATIC=1" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend and release regressions
        run: npm run test:frontend

      # Every reader suite runs on the target before anything is bundled.
      - name: Run backend tests
        shell: bash
        run: |
          npm run build
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust_target }} --features source-bundled
          elif [[ "${{ matrix.os }}" == "macos" ]]; then
            # Apple Silicon runner: ARM64 natively, x86_64 under Rosetta 2.
            cargo test --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
            cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin
          else
            cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust_target }}
          fi

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Ad-hoc signing avoids Apple Silicon apps being reported as damaged.
          # It is not notarization; users may still need to approve the app in Privacy & Security.
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos' && '-' || '' }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseDraft: ${{ needs.create-release.outputs.release_draft }}
          releaseAssetNamePattern: "Sivro-v[version]-[platform]-[arch]-[bundle][setup][ext]"
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          args: ${{ matrix.tauri_args }}

      - name: GUI end-to-end on the built app (Linux x86_64)
        if: matrix.rust_target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb
          cargo install tauri-driver --locked
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run -a node tests/e2e/run.mjs --bin src-tauri/target/x86_64-unknown-linux-gnu/release/sivro
          xvfb-run -a node tests/e2e/run.mjs --offline --bin src-tauri/target/x86_64-unknown-linux-gnu/release/sivro

  publish-release:
    name: Publish release
    needs: [create-release, build]
    if: needs.create-release.outputs.release_draft == 'true'
    runs-on: ubuntu-22.04
    # Configure required reviewers for this environment: publishing waits for
    # the manual macOS/Windows smoke checklist in docs/development.md.
    environment: release
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Assemble and validate updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release.json
          node scripts/create-update-manifest.mjs assets release.json assets/latest.json
          gh release upload "$RELEASE_TAG" assets/latest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Attach SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          (cd assets && rm -f SHA256SUMS.txt && sha256sum -- * > ../SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f draft=false
